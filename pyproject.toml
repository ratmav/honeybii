[project]
name = "honiipy"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = ["pillow", "typer"]

[project.scripts]
honiipy = "honiipy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honiipy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "laconic",
]

[tool.uv.sources]
laconic = { path = "../laconic", editable = true }

[tool.pytest.ini_options]
addopts = ["-q", "--tb=short", "-rf", "--no-header"]
